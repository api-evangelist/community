generated: '2026-08-13'
method: searched
source: https://developer.community.com/reference/
authentication:
  styles:
  - http bearer (JWT)
  - oauth2 authorizationCode
  detail: authentication/community-authentication.yml
  provisioning: API access provisioned by Community; contact saleseng@community.com
request_response:
  content_type: application/json
  async_model: >-
    Write operations are asynchronous and return 202 Accepted; the work is
    queued and processed after the response. Clients should not expect the
    created/modified resource in the response body.
idempotency:
  supported: false
  notes: >-
    The Async REST API documents no request idempotency key. It DOES apply
    server-side text deduplication on message_send (identical text to the same
    phone_number is dropped within 30 min for SMS / 10 min for WhatsApp), but
    this is content dedup, not a client-supplied idempotency contract, so no
    Idempotency scoring pointer is wired.
pagination:
  supported: false
  notes: Async write API has no list/pagination surface. Data Export API delivers full snapshot files.
messaging_semantics:
  quiet_hours: >-
    Messages outside 11am-8pm ET (US) are queued until Quiet Hours end; set
    override_quiet_hours=true to bypass.
  deduplication: identical text to the same phone_number is deduplicated (30 min SMS, 10 min WhatsApp)
  link_wrapping: all links in message text are rewritten with Community's link wrapper
  phone_format: 10-digit US/CA numbers, or 11 digits with leading 1
  communication_channel: pass communication_channel to route via WhatsApp (best-effort, 24h member-initiated window)
webhooks:
  signing_header: community-signature (HMAC with per-webhook shared secret)
  delivery: at-least-once; consumers must deduplicate by object/webhook id for >= 1 hour
  catalog: asyncapi/community-webhooks.yml
error_envelope:
  style: http-status-only
  detail: errors/community-problem-types.yml
rate_limit_signaling:
  documented: false
  verified: '2026-08-13'
  notes: >-
    Re-checked by fetching every page in developer.community.com/llms.txt as
    markdown and searching for rate limit / throttle / 429 / per second / per
    minute / quota — zero matches. No X-RateLimit-*, RateLimit-* or Retry-After
    header is documented and no 429 response is declared in the OpenAPI.
  detail: rate-limits/community-rate-limits.yml
data_export_conventions:
  transport: >-
    GET a resource path under https://dl.community.com/download/v1/files/{client_id}/;
    the API answers with a time-limited redirect URL to the file.
  redirect_ttl: 15 minutes — the redirect URL changes constantly and must not be cached
  formats: gzipped CSV by default; replace `csv` with `json` in the download URL for JSON
  freshness: full account snapshot regenerated every 24 hours, new files at 04:00 UTC
  auth: Bearer API token (community_api prefix) or a Seat Context session JWT
  source: https://developer.community.com/reference/data-export-api-downloading-data
testing:
  sandbox: false
  detail: sandbox/community-sandbox.yml
  notes: >-
    Community documents that no sandbox exists and directs customers to test in
    their production account with their own U.S./Canadian mobile numbers.
cross_links:
  errors: errors/community-problem-types.yml
  lifecycle: lifecycle/community-lifecycle.yml
  authentication: authentication/community-authentication.yml
  rate_limits: rate-limits/community-rate-limits.yml
