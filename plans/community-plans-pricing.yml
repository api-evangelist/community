notes: >-
  Community names three tiers on its public pricing page but publishes no price,
  currency, billing period, message/member quota, or overage for any of them.
  The page states that "plan-based pricing scales with your needs" and routes
  every tier to "Get your tailored quote" / book-a-demo, so this is a
  contact-sales pricing model with named tiers rather than published plans.
  Every price field is recorded as null on purpose — Community does not publish
  the number, and no figure is inferred from third-party review sites.
