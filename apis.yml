aid: community
name: Community
description: >-
  Community is a conversational messaging platform that lets brands, creators,
  artists, sports teams, media companies, and political organizations reach their
  audiences directly over SMS, MMS, WhatsApp, Apple Messages for Business, and
  RCS. Founded in 2019 and remote-first, Community pairs a campaign-and-flows
  product with a developer surface: an Async REST API to send Direct Messages,
  create and update members, set custom member data, manage subcommunities
  (tags), and opt members out; a Data Export API for member, campaign, and link
  analytics snapshots; and outbound webhooks for inbound/outbound messages and
  member lifecycle events. API access is provisioned per account by the Community
  team rather than self-serve.
